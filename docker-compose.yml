version: '3.8'

services:
  mongodb:
    image: mongo:7.0
    container_name: resto-mongo
    restart: unless-stopped
    ports:
      - '27017:27017'
    volumes:
      - mongo_data:/data/db
    environment:
      MONGO_INITDB_DATABASE: restaurant-platform

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: resto-backend
    restart: unless-stopped
    ports:
      - '4000:4000'
    environment:
      NODE_ENV: development
      MONGODB_URI: mongodb://mongodb:27017/restaurant-platform
      JWT_SECRET: change-this-secret-in-production
      JWT_EXPIRES_IN: 7d
      FRONTEND_URL: http://localhost:3000
      PORT: 4000
    depends_on:
      - mongodb
    volumes:
      - ./backend:/app
      - /app/node_modules

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      # NEXT_PUBLIC_* must be passed at BUILD time - Next.js inlines them into
      # the client bundle, so setting them under `environment` below would have
      # no effect and the app would ship pointing at localhost.
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:4000/graphql}
        NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:-ws://localhost:4000/graphql}
    container_name: resto-frontend
    restart: unless-stopped
    ports:
      - '3000:3000'
    depends_on:
      - backend

volumes:
  mongo_data:
