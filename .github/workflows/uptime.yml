# Watches the deployed API from outside it.
#
# The Telegram alerting inside the app cannot report its own absence: if the
# container OOMs, fails to boot, or the host sleeps it, nothing sends and the
# silence looks exactly like a healthy quiet day. This job runs on GitHub's
# machines, so it still speaks up when the server cannot.
#
# Enable it by setting two repository secrets and one variable:
#   secret   TELEGRAM_BOT_TOKEN       same bot as the app uses
#   secret   TELEGRAM_ALERT_CHAT_ID   same chat
#   variable HEALTHCHECK_URL          https://api.your-domain/health
# Until HEALTHCHECK_URL is set the job exits quietly, so merging this changes
# nothing.
#
# Note on timing: GitHub's scheduled runs are best-effort and often start late,
# sometimes by 10-15 minutes under load. This catches an outage, it does not
# measure one precisely. If you need tight timing, point UptimeRobot at the
# same /health endpoint instead - the endpoint is the part that matters.

name: Uptime

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch: # lets you run it by hand to test the alert path

concurrency:
  group: uptime
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check health endpoint
        id: check
        env:
          URL: ${{ vars.HEALTHCHECK_URL }}
        run: |
          if [ -z "$URL" ]; then
            echo "HEALTHCHECK_URL is not set - nothing to watch yet."
            echo "skipped=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Three attempts spaced out: a single failed request is usually a
          # blip or a redeploy, and paging on those trains you to ignore this.
          for attempt in 1 2 3; do
            # Emptied first: on a connection failure curl writes nothing, and a
            # leftover body from the previous attempt would be quoted in the
            # alert as if the server had answered.
            : > /tmp/body.txt
            # curl already prints 000 via -w when it cannot connect, so the
            # exit status is swallowed rather than appending a second code.
            code=$(curl -sS -o /tmp/body.txt -w '%{http_code}' \
                     --max-time 15 "$URL" 2>/dev/null) || true
            [ -z "$code" ] && code=000
            echo "attempt $attempt -> HTTP $code"
            if [ "$code" = "200" ]; then
              echo "healthy=true" >> "$GITHUB_OUTPUT"
              cat /tmp/body.txt
              exit 0
            fi
            [ "$attempt" -lt 3 ] && sleep 20
          done

          {
            echo "healthy=false"
            echo "code=$code"
            echo "body<<EOF"
            head -c 400 /tmp/body.txt 2>/dev/null || true
            echo ""
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
          exit 1

      - name: Alert Telegram
        if: failure() && steps.check.outputs.skipped != 'true'
        env:
          TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT: ${{ secrets.TELEGRAM_ALERT_CHAT_ID }}
          URL: ${{ vars.HEALTHCHECK_URL }}
          CODE: ${{ steps.check.outputs.code }}
          BODY: ${{ steps.check.outputs.body }}
        run: |
          if [ -z "$TOKEN" ] || [ -z "$CHAT" ]; then
            echo "Telegram secrets missing - cannot alert."
            exit 1
          fi
          # Built with printf then jq, so a stray quote in the response body
          # cannot break out of the JSON.
          TEXT=$(printf '%s\n' \
            "🚨 Vivora API is DOWN" \
            "$URL" \
            "HTTP ${CODE:-no response} after 3 attempts over ~40s" \
            "$BODY" \
            "Checked from GitHub Actions.")
          jq -n --arg chat "$CHAT" --arg text "$TEXT" \
             '{chat_id: $chat, text: $text, disable_web_page_preview: true}' \
             > /tmp/payload.json
          curl -sS --max-time 20 -X POST \
            "https://api.telegram.org/bot${TOKEN}/sendMessage" \
            -H 'Content-Type: application/json; charset=utf-8' \
            --data-binary @/tmp/payload.json
